name: iOS Device Build

on:
  workflow_dispatch:

concurrency:
  group: ios-device-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUILD_CONFIGURATION: release_device_arm64

jobs:
  build:
    name: Build (release_device_arm64)
    runs-on: xcode-27
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Bazel artifacts and downloaded libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/telegram-bazel-cache
            ${{ runner.temp }}/bazel-repository-cache
          key: bazel-${{ runner.os }}-${{ env.BUILD_CONFIGURATION }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '**/Package.swift', '**/Package.resolved', 'build-system/**/*.bzl') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ env.BUILD_CONFIGURATION }}-

      - name: Configure Bazel caches
        run: |
          mkdir -p "$RUNNER_TEMP/telegram-bazel-cache" "$RUNNER_TEMP/bazel-repository-cache"
          printf '\nbuild --repository_cache=%s\nbuild --repo_contents_cache=%s\n' \
            "$RUNNER_TEMP/bazel-repository-cache" \
            "$RUNNER_TEMP/bazel-repository-cache/contents" >> .bazelrc

      - name: Import fake codesigning certificate
        run: |
          KEYCHAIN="$RUNNER_TEMP/pleasuregram-codesign.keychain-db"
          security create-keychain -p temp123 "$KEYCHAIN"
          security unlock-keychain -p temp123 "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security import build-system/fake-codesigning/certs/SelfSigned.p12 \
            -k "$KEYCHAIN" -P '' -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp123 "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning

      - name: Read app version
        id: version
        run: echo "app_version=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir "$RUNNER_TEMP/telegram-bazel-cache" \
            build \
            --configurationPath build-system/ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=1 \
            --configuration="$BUILD_CONFIGURATION"

      - name: Rename IPA
        run: cp bazel-bin/Telegram/Telegram.ipa Pleasuregram-device.ipa

      - name: Publish IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-device-${{ github.run_number }}
          name: Pleasuregram iOS ${{ steps.version.outputs.app_version }} device build (build ${{ github.run_number }})
          prerelease: true
          body: |
            Device (arm64) build of Pleasuregram, signed with the repository's fake certificate.

            Re-sign it with your own Apple ID (AltStore / Sideloadly) before installing, or replace the
            certificate and profiles with real App Store/ad-hoc ones for TestFlight distribution.

            - Commit: `${{ github.sha }}`
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: Pleasuregram-device.ipa

      - name: Save Bazel cache on failure
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/telegram-bazel-cache
            ${{ runner.temp }}/bazel-repository-cache
          key: bazel-${{ runner.os }}-${{ env.BUILD_CONFIGURATION }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '**/Package.swift', '**/Package.resolved', 'build-system/**/*.bzl') }}-partial
