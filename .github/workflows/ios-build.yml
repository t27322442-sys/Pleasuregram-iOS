name: iOS Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (debug_sim_arm64)
    runs-on: xcode-27
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Bazel artifacts and downloaded libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/telegram-bazel-cache
            ${{ runner.temp }}/bazel-repository-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '**/Package.swift', '**/Package.resolved', 'build-system/**/*.bzl') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Configure Bazel caches
        run: |
          mkdir -p "$RUNNER_TEMP/telegram-bazel-cache" "$RUNNER_TEMP/bazel-repository-cache"
          printf '\nbuild --repository_cache=%s\nbuild --repo_contents_cache=%s\n' \
            "$RUNNER_TEMP/bazel-repository-cache" \
            "$RUNNER_TEMP/bazel-repository-cache/contents" >> .bazelrc

      - name: Build
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir "$RUNNER_TEMP/telegram-bazel-cache" \
            build \
            --configurationPath build-system/ci-configuration.json \
            --xcodeManagedCodesigning \
            --buildNumber=1 \
            --configuration=debug_sim_arm64
