name: iOS Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUILD_CONFIGURATION: release_sim_arm64

jobs:
  build:
    name: Build (release_sim_arm64)
    runs-on: xcode-27
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Bazel artifacts and downloaded libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/telegram-bazel-cache
            ${{ runner.temp }}/bazel-repository-cache
          key: bazel-${{ runner.os }}-${{ env.BUILD_CONFIGURATION }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '**/Package.swift', '**/Package.resolved', 'build-system/**/*.bzl') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ env.BUILD_CONFIGURATION }}-

      - name: Configure Bazel caches
        run: |
          mkdir -p "$RUNNER_TEMP/telegram-bazel-cache" "$RUNNER_TEMP/bazel-repository-cache"
          printf '\nbuild --repository_cache=%s\nbuild --repo_contents_cache=%s\n' \
            "$RUNNER_TEMP/bazel-repository-cache" \
            "$RUNNER_TEMP/bazel-repository-cache/contents" >> .bazelrc

      - name: Read app version
        id: version
        run: echo "app_version=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir "$RUNNER_TEMP/telegram-bazel-cache" \
            build \
            --configurationPath build-system/ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=1 \
            --configuration="$BUILD_CONFIGURATION"

      - name: Rename IPA
        run: cp bazel-bin/Telegram/Telegram.ipa Pleasuregram.ipa

      - name: Publish IPA to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-sim-${{ github.run_number }}
          name: Pleasuregram iOS ${{ steps.version.outputs.app_version }} release (build ${{ github.run_number }})
          prerelease: true
          body: |
            Automated `release_sim_arm64` build (simulator, fake codesigning).

            - Commit: `${{ github.sha }}`
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: Pleasuregram.ipa
